name: SillyTavern 1.19.0 Android update APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - upgrade/sillytavern-1.19.0
      - feat/character-editor-compact-menu

permissions:
  contents: read

# The GitHub Actions Android update build deliberately runs independently:
# a cancelled asset packaging job can take minutes to shut down.
jobs:
  android-preview:
    name: Build original-package SillyTavern 1.19.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Android wrapper
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22 for packaging
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Test TalkBack labels and decorative controls
        run: |
          node --check app/src/main/assets/st-accessibility.js
          node --check app/src/main/assets/st-preset-studio.js
          node --check app/src/main/assets/st-preset-features.js
          node --check app/src/main/assets/st-character-studio.js
          node --check app/src/main/assets/st-lorebook-studio.js
          node --check app/src/main/assets/st-extension-studio.js
          node --check app/src/main/assets/st-debug-panel.js
          node tests/a11y-smoke.mjs
          node tests/preset-studio-smoke.mjs

      - name: Install Android SDK 34
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Android asset extraction dependencies
        run: python -m pip install zstandard

      - name: Download Node.js ARM64 and package SillyTavern 1.19.0
        timeout-minutes: 55
        run: |
          python scripts/setup_assets.py --st-branch 1.19.0
          python scripts/verify_upgrade_bundle.py

      - name: Browser-test Preset Studio with real SillyTavern 1.19.0 HTML
        timeout-minutes: 8
        run: |
          python -m pip install playwright
          python tests/preset-studio-browser.py
          python tests/preset-features-browser.py
          python tests/character-studio-browser.py
          python tests/lorebook-studio-browser.py
          python tests/extension-studio-browser.py
          python tests/debug-panel-browser.py
          python tests/debug-console-bounds-browser.py
          python tests/debug-console-compact-browser.py
          python tests/android-tts-browser.py

      - name: Configure Huy123456-specific stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/sillytavern-stable-debug.jks"
          base64 --decode .github/signing/stable-debug.keystore.b64 > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -v > "$RUNNER_TEMP/signing-certificate.txt"
          echo "STABLE_DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build update APK with the original Android application ID
        timeout-minutes: 20
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and publish version details
        shell: bash
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          DEST="SillyTavern-1.19.0-Android-update.apk"
          test -s "$SRC"
          cp "$SRC" "$DEST"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$DEST" | tee "$RUNNER_TEMP/apksigner-verification.txt"
          EXPECTED="ab791c992c301be6837fd7946fe6ac403d1b670034a1f1a7883bde6204921699"
          ACTUAL="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apksigner-verification.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Unexpected APK signer. Refusing to publish."; exit 1
          fi
          BADGING="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$DEST")"
          printf '%s\n' "$BADGING" | grep -E '^package:|^sdkVersion:'
          if [[ "$BADGING" != *"package: name='com.jiuguan.sillytavern.android' versionCode='11911'"* ]]; then
            echo "Unexpected package ID or versionCode. Refusing to publish."; exit 1
          fi
          if [[ "$BADGING" == *"com.jiuguan.sillytavern.android.preview"* ]]; then
            echo "Wrong isolated preview package. Refusing to publish."; exit 1
          fi
          sha256sum "$DEST" | tee "$DEST.sha256"
          cat > BUILD-INFO.txt <<'INFO'
          SillyTavern 1.19.0 Android update
          SillyTavern source: official tag 1.19.0
          Android application ID: com.jiuguan.sillytavern.android (NO .preview suffix)
          Version code: 11911
          Local server: http://127.0.0.1:8001
          Signing: fixed Huy123456 debug cert SHA256 ab791c992c301be6837fd7946fe6ac403d1b670034a1f1a7883bde6204921699
          IMPORTANT: Android in-place installation only works if the currently installed APK has THIS SAME signing certificate and package ID.
          The original 1.0.0 APK may have used another (unavailable) debug key. This CI build cannot bypass Android signature checks.
          Never uninstall the existing app before backing up user data.
          Native libraries: Termux libffi.so and DT_NEEDED closure verified before Gradle build.
          Data: stays in the existing app sandbox ONLY when Android accepts this APK as a valid in-place update.
          Caveat: Android native tokenizer stubs may reduce token-count accuracy.
          INFO

      - name: Upload original-package update APK
        uses: actions/upload-artifact@v4
        with:
          name: SillyTavern-1.19.0-Android-update
          path: |
            SillyTavern-1.19.0-Android-update.apk
            SillyTavern-1.19.0-Android-update.apk.sha256
            BUILD-INFO.txt
            debug-console-preview.png
            debug-prompts-preview.png
            debug-raw-preview.png
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
